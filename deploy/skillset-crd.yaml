apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: skillsets.agentic-snake.dev
spec:
  group: agentic-snake.dev
  scope: Namespaced
  names:
    plural: skillsets
    singular: skillset
    kind: SkillSet
    shortNames: [skills]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [sources]
              properties:
                sources:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: object
                    required: [kind, name, key]
                    properties:
                      kind:
                        type: string
                        enum: [ConfigMap, Secret]
                      name:
                        type: string
                        maxLength: 253
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      key:
                        type: string
                        minLength: 1
                        maxLength: 253
            status:
              type: object
              properties:
                valid:
                  type: boolean
                observedGeneration:
                  type: integer
                  format: int64
                lastValidRevision:
                  type: string
                sourceVersions:
                  type: array
                  maxItems: 32
                  items:
                    type: string
